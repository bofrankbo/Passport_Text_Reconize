<!DOCTYPE html>
<html lang="zh-Hant-TW">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Page</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            .container {
                margin-top: 50px;
            }
            .form-group {
                margin-bottom: 20px;
            }
            .btn {
                width: 100%;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>管理後台</h1>
    
            <!-- 查詢表單 -->
            <div class="form-group">
                <label for="personalNumber">身分證號：</label>
                <input type="text" id="personalNumber" class="form-control" placeholder="請輸入身分證號">
            </div>
            <div class="form-group">
                <button class="btn btn-primary" onclick="searchUser()">查詢</button>
            </div>
    
            <!-- 顯示查詢結果 -->
            <div id="result" class="alert alert-info" style="display: none;"></div>
    
            <!-- 匯出 CSV -->
            <div class="form-group">
                <a href="/export_csv" class="btn btn-success">匯出所有資料 (CSV)</a>
            </div>
        </div>
    
        <script>
            function searchUser() {
                const personalNumber = document.getElementById("personalNumber").value;
    
                if (!personalNumber) {
                    alert("請輸入身分證號！");
                    return;
                }
    
                // 發送 GET 請求到 /search 查詢用戶資料
                fetch(`/search?personal_number=${personalNumber}`)
                    .then(response => response.json())
                    .then(data => {
                        const resultDiv = document.getElementById("result");
    
                        if (data.error) {
                            resultDiv.style.display = "none";
                            alert(data.error);
                        } else {
                            resultDiv.innerHTML = `
                                <strong>姓名:</strong> ${data.name} ${data.surname}<br>
                                <strong>性別:</strong> ${data.sex}<br>
                                <strong>出生日期:</strong> ${data.date_of_birth}<br>
                                <strong>國籍:</strong> ${data.nationality}<br>
                                <strong>護照號碼:</strong> ${data.passport_number}<br>
                                <strong>發證國:</strong> ${data.issuing_country}<br>
                                <strong>有效期限:</strong> ${data.expiration_date}<br>
                                <strong>身分證號:</strong> ${data.personal_number}
                            `;
                            resultDiv.style.display = "block";
                        }
                    })
                    .catch(error => {
                        alert("查詢時發生錯誤！請稍後再試。");
                    });
            }
        </script>
    
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    </html>
