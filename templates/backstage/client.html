<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅客管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <style>
        .form-group {
            margin-bottom: 20px;
        }

        #mainContent {
            margin: 0 auto;
            /* 水平置中 */
            max-width: 1200px;
            /* 設置最大寬度，根據需要調整 */
            margin-top: 100px;
            padding: 20px;
            /* 添加內邊距 */
        }

        .hidden {
            display: none;
        }

        /* 調整內容區域的左邊距 */
        body {
            transition: margin-left 0.3s ease;
            /* 平滑過渡效果 */
            background-color: #f8f9fa;
            /* 主內容背景色 */
            font-family: 'Arial', sans-serif;
            /* 字體設置 */
        }
    </style>
</head>

<body>

    <!-- <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasScrolling" aria-controls="offcanvasScrolling">Enable body scrolling</button> -->
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">客戶管理</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
                aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="offcanvasNavbar"
                aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">後台管理系統</h5>
                    <button type="button" class="btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link py-2" href="admin.html">控制台</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link py-2" href="client.html">旅客資料</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link py-2" href="trip.html">設定行程</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link py-2" href="backup.html">備份管理</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div id="mainContent" class="container">

        <!-- 使用 Flexbox 實現左右佈局 -->
        <!-- 新增旅客 -->
        <div class="row align-items-end">
            <div class="row-md-4">
                <label for="suggest" class="form-label">查詢身分證或護照號碼</label>
                <input type="text" id="suggest" class="form-control" placeholder="A12345678" oninput="suggestNumber()">
                <ul id="suggestions" class="list-group position-absolute mt-1" style="display: none; z-index: 100;">
                </ul>
            </div>
            <div class="col-md-4">
                <label for="personalNumber" class="form-label">身分證字號</label>
                <div id="personalNumber" class="form-control bg-light text-dark"
                    style="height: 38px; min-width: 200px; text-align: left;"> </div>
            </div>
            <div class="col-md-4">
                <label for="passportNumber" class="form-label">護照號碼</label>
                <div id="passportNumber" class="form-control bg-light text-dark"
                    style="height: 38px; min-width: 200px; text-align: left;"> </div>
            </div>
            <div class="col-md-4">
                <button onclick="searchUser()" class="btn btn-secondary w-100">查詢客戶</button>
            </div>

            <!-- 顯示查詢結果 -->
            <div class="md-4">
                <div id="result" class="alert alert-info" style="display: none;"></div>
            </div>

            <div class="mt-3">
                <div class="card">
                    <div class="card-body text-start">
                        <h5 class="card-title">資料管理</h5>
                    </div>

                    <p>
                        <a href="/export_csv" class="btn btn-success">匯出所有旅客資料</a>
                        <button class="btn btn-success" type="button" data-bs-toggle="collapse"
                            data-bs-target="#collapseWidthExample" aria-expanded="false"
                            aria-controls="collapseWidthExample">
                            匯入並覆蓋所有旅客資料
                        </button>
                    </p>
                    <div style="min-height: 120px;">
                        <div class="collapse collapse-horizontal" id="collapseWidthExample">
                            <div class="card card-body" style="width: 300px;">
                                <form action="/import_csv" method="post" enctype="multipart/form-data"
                                    class="d-inline-block">
                                    只能上傳格式正確的 CSV 檔案
                                    <div class="mb-3">
                                        <input class="form-control" type="file" id="csvFile" name="csvFile"
                                            accept=".csv">
                                    </div>
                                    <button type="submit" class="btn btn-danger float-end">上傳</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script>
        // 自動推薦系統
        function suggestNumber() {
            const input = document.getElementById("suggest").value;
            const suggestionsList = document.getElementById("suggestions");

            if (!input && !input_passport) {
                suggestionsList.style.display = "none";
                return;
            }

            // 根據身分證或護照建議旅客
            fetch(`/suggest_id?query=${input}`)
                .then(response => response.json())
                .then(data => {
                    if (data.length > 0) {
                        suggestionsList.style.display = "block";
                        suggestionsList.innerHTML = data
                            .map(user => `
                                    <li class="list-group-item" onclick='selected(${JSON.stringify(user)})'>
                                        ${user.personal_number} / ${user.passport_number} - ${user.name} ${user.surname}
                                    </li>`)
                            .join("");
                    } else {
                        suggestionsList.style.display = "none";
                    }
                })
                .catch(error => {
                    console.error("Error fetching suggestions:", error);
                });
        }

        // selected -------------------------------------
        // 選擇建議的旅客
        function selected(user) {
            traveler = user;
            document.getElementById("personalNumber").textContent = user.personal_number;
            document.getElementById("passportNumber").textContent = user.passport_number;
            document.getElementById("suggestions").style.display = "none";
        }

        // 查詢用戶
        function searchUser() {
            const personalNumber = document.getElementById("personalNumber").textContent.trim();

            if (!personalNumber && !passportNumber) {
                alert("請至少輸入身分證號或護照號碼！");
                return;
            }

            // 根據輸入的身分證號或護照號碼查詢
            fetch(`/get_client?personal_number=${personalNumber}`)
                .then(response => response.json())
                .then(data => {
                    const resultDiv = document.getElementById("result");

                    if (data.error) {
                        resultDiv.style.display = "none";
                        alert(data.error);
                    } else {
                        resultDiv.innerHTML = `
                                <strong>名字:</strong> <input type="text" id="nameField" value="${data.name}" /><br>
                                <strong>姓氏:</strong> <input type="text" id="surnameField" value="${data.surname}" /><br>
                                <strong>性別:</strong> <input type="text" id="sexField" value="${data.sex}" /><br>
                                <strong>出生日期:</strong> <input type="text" id="dobField" value="${data.date_of_birth}" /><br>
                                <strong>國籍:</strong> <input type="text" id="nationalityField" value="${data.nationality}" /><br>
                                <strong>護照類型:</strong> <input type="text" id="passportTypeField" value="${data.passport_type}" /><br>
                                <strong>護照號碼:</strong> <input type="text" id="passport_numberField" value="${data.passport_number}" /><br>
                                <strong>發證國:</strong> <input type="text" id="issuing_countryField" value="${data.issuing_country}" /><br>
                                <strong>有效期限:</strong> <input type="text" id="expiration_dateField" value="${data.expiration_date}" /><br>
                                <strong>身分證號:</strong> <input type="text" id="personal_numberField" value="${data.personal_number}" /><br>
                                <button onclick="saveChanges()">儲存更改</button>
                            `;
                        resultDiv.style.display = "block";
                    }
                })
                .catch(error => {
                    alert("查詢時發生錯誤！請稍後再試。");
                });
        }

        function saveChanges() {
            const name = document.getElementById('nameField').value;
            const surname = document.getElementById('surnameField').value;
            const sex = document.getElementById('sexField').value;
            const dob = document.getElementById('dobField').value;
            const nationality = document.getElementById('nationalityField').value;
            const passportType = document.getElementById('passportTypeField').value;
            const passport_number = document.getElementById('passport_numberField').value;
            const issuing_country = document.getElementById('issuing_countryField').value;
            const expiration_date = document.getElementById('expiration_dateField').value;
            const personal_number = document.getElementById('personal_numberField').value;

            // 將修改後的資料傳回伺服器
            const updatedData = {
                name,
                surname,
                sex,
                date_of_birth: dob,
                nationality,
                passport_type: passportType,
                passport_number,
                issuing_country,
                expiration_date,
                personal_number,
            };

            fetch('/submit_passport', { // 替換為您的提交 API
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(updatedData),
            })
                .then((response) => response.json())
                .then((result) => {
                    if (result.success) {
                        alert('資料提交成功！');
                    } else {
                        console.error('Error:', result.error);
                        alert('提交失敗，請重試！', result.error);
                    }
                })
                .catch((error) => {
                    console.error('Error:', error);
                    alert('伺服器錯誤，請稍後再試。');
                });
        }

    </script>

</body>

</html>
