<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅客管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <style>
        .form-group {
            margin-bottom: 20px;
        }

        #mainContent {
            margin: 0 auto;
            /* 水平置中 */
            max-width: 1200px;
            /* 設置最大寬度，根據需要調整 */
            margin-top: 100px;
            padding: 20px;
            /* 添加內邊距 */
        }

        .hidden {
            display: none;
        }

        /* 調整內容區域的左邊距 */
        body {
            transition: margin-left 0.3s ease;
            /* 平滑過渡效果 */
            background-color: #f8f9fa;
            /* 主內容背景色 */
            font-family: 'Arial', sans-serif;
            /* 字體設置 */
        }

        table {
            width: 100%;
            table-layout: fixed;
            /* 固定佈局 */
            font-size: 13px;
            /* 縮小字形大小 */
        }

        th,
        td {
            padding: 8px;
            border: 1px solid #ddd;
            width: 110px;
            /* 固定寬度 */
        }

        th.index,
        td.index {
            width: 40px;
            /* Index 欄位寬度 */
        }

        th.sex,
        td.sex {
            width: 110px;
            /* 性別欄位寬度 */
        }

        td input[type="text"],
        td input[type="date"],
        td select {
            width: 100%;
            box-sizing: border-box;
            padding: 5px 10px;
            font-size: 14px;
            line-height: 1.42857143;
            color: #555;
            background-color: #fff;
            background-image: none;
            border: 1px solid #ccc;
            border-radius: 4px;
            height: 34px;
            /* 確保select元素的高度與input元素一致 */
        }

        th.date,
        td.date {
            width: 140px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">客戶管理</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
                aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="offcanvasNavbar"
                aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">後台管理系統</h5>
                    <button type="button" class="btn-close-white" data-bs-dismiss="offcanvas"
                        aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link py-2" href="admin.html">控制台</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link py-2" href="client.html">旅客資料</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link py-2" href="trip.html">設定行程</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link py-2" href="backup.html">備份管理</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div id="mainContent" class="container">
        <div class="card border-info">
            <div class="card-header bg-info text-gray">
                <h5 class="mb-0">旅客管理</h5>
            </div>

            <div class="card-body">
                <div class="row-md-4">
                    <form class="d-flex" role="search">
                        <input type="search" class="form-control me-2" id="suggest" placeholder="查詢身分證或護照號碼"
                            aria-label="Search" oninput="suggestNumber()">
                        <button class="btn btn-outline-success" type="submit">Search</button>
                    </form>
                    <ul id="suggestions" class="list-group position-absolute mt-1" style="display: none; z-index: 100;">
                    </ul>
                </div>

                <div class="md-4">
                    <div id="result" class="alert alert-info" style="display: none;"></div>
                </div>
                <p></p>
                <div id="travelersTable" style="overflow-x:auto;">
                    <table id="clientsTable" class="table table-bordered">
                        <thead>
                            <tr>
                                <th class="index"></th>
                                <th>中文姓名</th>
                                <th>身分證字號</th>
                                <th>英文名</th>
                                <th>英文姓</th>
                                <th class="sex">性別</th>
                                <th class="date">出生日期</th>
                                <th>國籍</th>
                                <th>護照號碼</th>
                                <th>發證國</th>
                                <th class="date">護照期限</th>
                            </tr>
                        </thead>
                        <tbody id="travelersBody">
                            <!-- 旅客資料將動態插入這裡 -->
                        </tbody>
                    </table>
                </div>
                <p></p>
                <button onclick="saveChanges()" class="btn btn-primary float-end">儲存更改</button>

            </div>
        </div>
    </div>


    <script>
        // 將 data 設定為公共變數
        let clientsData = [];

        function generateTravelerRow(traveler, index) {
            return `
                <tr>
                    <td class="index">${index + 1}</td>
                    <td><input type="text" name="name_ch" value="${traveler.name_ch}"></td>
                    <td><input type="text" name="personal_number" value="${traveler.personal_number}"></td>
                    <td><input type="text" name="name" value="${traveler.name}"></td>
                    <td><input type="text" name="surname" value="${traveler.surname}"></td>
                    <td class="sex">
                        <select type="sex" id="sexField" class="form-control">
                            <option value='M' ${traveler.sex === 'M' ? 'selected' : ''}>男 (M)</option>
                            <option value='F' ${traveler.sex === 'F' ? 'selected' : ''}>女 (F)</option>
                            <option value='X' ${traveler.sex === 'X' ? 'selected' : ''}>其他 (X)</option>
                        </select>
                    </td>
                    <td><input type="date" name="date_of_birth" value="${traveler.date_of_birth}"></td>
                    <td><input type="text" name="nationality" value="${traveler.nationality}"></td>
                    <td><input type="text" name="passport_number" value="${traveler.passport_number}"></td>
                    <td><input type="text" name="issuing_country" value="${traveler.issuing_country}"></td>
                    <td><input type="date" name="expiration_date" value="${traveler.expiration_date}"></td>
                </tr>
            `;
        }

        function suggestNumber() {
            const input = document.getElementById('suggest').value.toLowerCase();
            const suggestions = clientsData.filter(client =>
                client.passport_number.toLowerCase().includes(input) ||
                client.personal_number.toLowerCase().includes(input)
            );
            console.log(suggestions);

            const travelersBody = document.getElementById('travelersBody');
            travelersBody.innerHTML = suggestions.map(generateTravelerRow).join('');
        }

        document.addEventListener("DOMContentLoaded", function () {
            fetch('/get_client?')
                .then(response => response.json())
                .then(data => {
                    clientsData = data;
                    const travelersBody = document.getElementById("travelersBody");
                    travelersBody.innerHTML = data.map(generateTravelerRow).join("");
                })
                .catch(error => console.error('Error fetching travelers:', error));
        });


        function updateClientsData() {
            let table = document.getElementById("clientsTable");
            for (let i = 1, row; row = table.rows[i]; i++) {
                let client = {};
                client.name_ch = row.cells[1].querySelector('input').value;
                client.personal_number = row.cells[2].querySelector('input').value;
                client.name = row.cells[3].querySelector('input').value;
                client.surname = row.cells[4].querySelector('input').value;
                client.sex = row.cells[5].querySelector('select').value;
                client.date_of_birth = row.cells[6].querySelector('input').value;
                client.nationality = row.cells[7].querySelector('input').value;
                client.passport_number = row.cells[8].querySelector('input').value;
                client.issuing_country = row.cells[9].querySelector('input').value;
                client.expiration_date = row.cells[10].querySelector('input').value;
                clientsData.push(client);
            }
        }

        function saveChanges() {
            updateClientsData();
            fetch('/submit_passport', { // 替換為您的提交 API
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(clientsData),
            })
                .then((response) => response.json())
                .then((result) => {
                    if (result.success) {
                        alert('資料提交成功！');
                    } else {
                        console.error('Error:', result.error);
                        alert('提交失敗，請重試！', result.error);
                    }
                })
                .catch((error) => {
                    console.error('Error:', error);
                    alert('伺服器錯誤，請稍後再試。');
                });
        }
    </script>

</body>

</html>
