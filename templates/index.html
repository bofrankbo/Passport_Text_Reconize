        <!-- Custom JS for Camera and OCR -->
        <script>
            const video = document.getElementById('camera');
            const text_scan = document.getElementById('scanning');
            const captureButton = document.getElementById('captureButton');
            const resultContainer = document.getElementById('result-container');
            const ocrResult = document.getElementById('ocrResult');
            const imageInput = document.getElementById('imageInput');
            const resultText = document.getElementById('resultText');

            // 發送圖片到伺服器
            document.getElementById('captureButton').addEventListener('click', () => {
                const file = imageInput.files[0]; // 從 imageInput 中獲取檔案
                if (file) {
                    text_scan.style.display = "block"; // 顯示 "正在辨識中"

                    const formData = new FormData();
                    formData.append('image', file); // 將檔案附加到 FormData 中

                    fetch('/process_passport', { // 替換成你的 API 路徑
                        method: 'POST',
                        body: formData, // 傳送 FormData
                    })
                    .then((response) => response.json())
                    .then((data) => {
                        text_scan.style.display = "none"; // 隱藏 "正在辨識中"
                        if (data.success) {
                            // 將辨識結果分別填入表單欄位
                            document.getElementById('nameField').value = data.result.name;
                            document.getElementById('surnameField').value = data.result.surname;
                            document.getElementById('sexField').value = data.result.sex;
                            document.getElementById('dobField').value = data.result.date_of_birth;
                            document.getElementById('nationalityField').value = data.result.nationality;
                            document.getElementById('passportTypeField').value = data.result.passport_type;
                            document.getElementById('passport_numberField').value = data.result.passport_number;
                            document.getElementById('issuing_countryField').value = data.result.issuing_country;
                            document.getElementById('expiration_dateField').value = data.result.expiration_date;
                            document.getElementById('personal_numberField').value = data.result.personal_number;
                        } else {
                            alert("辨識失敗，請重新嘗試。");
                        }
                    })
                    .catch((error) => {
                        console.error('Error:', error);
                        text_scan.style.display = "none"; // 隱藏 "正在辨識中"
                        alert("伺服器錯誤，請稍後再試。");
                    });
                } else {
                    alert("請先選擇一個檔案！");
                }
            });

            // 確認並提交按鈕的點擊事件
            document.getElementById('confirmButton').addEventListener('click', () => {
                const name = document.getElementById('nameField').value;
                const surname = document.getElementById('surnameField').value;
                const sex = document.getElementById('sexField').value;
                const dob = document.getElementById('dobField').value;
                const nationality = document.getElementById('nationalityField').value;
                const passportType = document.getElementById('passportTypeField').value;
                const passport_number = document.getElementById('passport_numberField').value;
                const issuing_country = document.getElementById('issuing_countryField').value;
                const expiration_date = document.getElementById('expiration_dateField').value;
                const personal_number = document.getElementById('personal_numberField').value;

                // 將修改後的資料傳回伺服器
                const updatedData = {
                    name,
                    surname,
                    sex,
                    date_of_birth : dob,
                    nationality,
                    passport_type : passportType,
                    passport_number,
                    issuing_country,
                    expiration_date,
                    personal_number,
                };

                fetch('/submit_passport', { // 替換為您的提交 API
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(updatedData),
                })
                .then((response) => response.json())
                .then((result) => {
                    if (result.success) {
                        alert('資料提交成功！');
                    } else {
                        console.error('Error:', result.error);
                        alert('提交失敗，請重試！', result.error);
                    }
                })
                .catch((error) => {
                    console.error('Error:', error);
                    alert('伺服器錯誤，請稍後再試。');
                });
            });

        </script>
