        <!-- Custom JS for Camera and OCR -->
        <script>
            const video = document.getElementById('camera');
            const text_scan = document.getElementById('scanning');
            const captureButton = document.getElementById('captureButton');
            const resultContainer = document.getElementById('result-container');
            const ocrResult = document.getElementById('ocrResult');
            const imageInput = document.getElementById('imageInput');
            const resultText = document.getElementById('resultText');

            // 發送圖片到伺服器
            document.getElementById('captureButton').addEventListener('click', () => {
                const file = imageInput.files[0]; // 從 imageInput 中獲取檔案
                if (file) {
                    text_scan.style.display = "block"; // 顯示 "正在辨識中"

                    const formData = new FormData();
                    formData.append('image', file); // 將檔案附加到 FormData 中

                    fetch('/process_passport', { // 替換成你的 API 路徑
                        method: 'POST',
                        body: formData, // 傳送 FormData
                    })
                        .then((response) => response.json())
                        .then((data) => {
                            text_scan.style.display = "none"; // 隱藏 "正在辨識中"
                            if (data.success) {
                                alert("辨識成功！結果如下：\n" + data.result); // 彈出辨識結果
                            } else {
                                alert("辨識失敗，請重新嘗試。");
                            }
                        })
                        .catch((error) => {
                            console.error('Error:', error);
                            text_scan.style.display = "none"; // 隱藏 "正在辨識中"
                            alert("伺服器錯誤，請稍後再試。");
                        });
                } else {
                    alert("請先選擇一個檔案！");
                }
            });

            // 提交修正後的辨識結果
            document.getElementById('confirmButton').addEventListener('click', () => {
                const correctedText = ocrResult.value;
                fetch('/save_data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: correctedText })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        alert('資料已成功儲存');
                    } else {
                        alert('儲存失敗，請重試');
                    }
                })
                .catch((error) => console.error('Error:', error));
            });
